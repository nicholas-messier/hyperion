services:
  ibd-tracker:
    build: .
    container_name: ibd-tracker
    restart: unless-stopped
    ports:
      - "${IBD_TRACKER_PORT:-8080}:8080"
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      - API_KEY=${IBD_TRACKER_API_KEY:-}
      - DB_PATH=/app/data/tracker.db
    volumes:
      - ./data:/app/data
