conky.config = {
    alignment = "top_left",
    gap_x = 20,
    gap_y = 20,

    update_interval = 60,
    total_run_times = 0,

    use_xft = true,
    font = "JetBrainsMono Nerd Font:size=11",
    use_spacer = "none",

    minimum_width = 300,
    maximum_width = 300,
    text_buffer_size = 2048,
    override_utf8_locale = true,

    own_window = true,
    own_window_type = 'dock',        -- safe for Mint
    own_window_transparent = true,
    own_window_argb_visual = false,  -- avoids X errors
    own_window_argb_value = 0,
    own_window_hints = "undecorated,sticky,skip_taskbar,skip_pager,below",

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    double_buffer = true,
};

conky.text = [[
${color #add8e6}Weather – Laconia, NH${color}
${color #888888}──────────────────────────────${color}
${execi 1200 $HOME/bin/conky/update_weather.sh >/dev/null 2>&1; cat $HOME/.cache/wttr_laconia.txt 2>/dev/null || echo "Loading..."}
]];








