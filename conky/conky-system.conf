conky.config = {
    alignment = "top_right",
    gap_x = 360,
    gap_y = 20,

    update_interval = 5,
    total_run_times = 0,

    use_xft = true,
    font = "JetBrainsMono Nerd Font:size=12",
    use_spacer = "none",

    minimum_width = 320,
    minimum_height = 450,
    maximum_width = 420,
    text_buffer_size = 4096,
    override_utf8_locale = true, 

    own_window = true,
    own_window_type = "desktop",
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_colour = "#000000",

    own_window_hints = "undecorated,sticky,skip_taskbar,skip_pager,below",

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    double_buffer = true,
};

conky.text = [[
${color #ffffff}${font JetBrainsMono Nerd Font:size=16}__SERVER_HOSTNAME__${font}${color}
${color #888888}--------------------------------${color}
${color #add8e6}Uptime:${color} ${uptime_short}  ${color #add8e6}IP:${color} ${execi 60 ip -4 addr show | grep -oP 'inet \K[\d.]+' | grep -v 127.0.0.1 | head -1}
${color #add8e6}Mint:${color}   ${execi 3600 lsb_release -ds}
${color #add8e6}Kernel:${color} ${kernel}
${execi 5 __BIN_DIR__/conky/update_gpu.sh}\
${color #add8e6}CPU:${color}    ${cpu}%
${color #add8e6}GPU:${color}    ${cat __HOME_DIR__/.cache/gpu_util}
${color #add8e6}Temp:${color}   CPU ${execi 15 sensors 2>/dev/null | awk '/Package id 0:/{gsub(/\+/,""); print $4}'}  GPU ${cat __HOME_DIR__/.cache/gpu_temp}
${color #add8e6}Memory:${color} ${mem} / ${memmax} (${memperc}%)
${color #888888}--------------------------------${color}
${color #add8e6}Data:${color}     ${execi 60 df -H __CONKY_DATA_DISK__ | awk 'NR==2{print $4 " free / " $2}'}
${color #add8e6}Archive:${color}  ${execi 60 df -H __CONKY_ARCHIVE_DISK__ | awk 'NR==2{print $4 " free / " $2}'}
${color #add8e6}External:${color} ${execi 60 mountpoint -q __CONKY_EXTERNAL_DISK__ 2>/dev/null && df -H __CONKY_EXTERNAL_DISK__ | awk 'NR==2{print $4 " free / " $2}' || echo "disconnected"}
${color #888888}--------------------------------${color}
${color #add8e6}Plex:${color} \
${if_match "${execi 30 systemctl is-active __PLEX_SERVICE__}" == "active"}\
${color green}active\
${else}\
${color red}inactive\
${endif}${color}
${color #add8e6}ErsatzTV:${color} \
${if_match "${execi 30 docker inspect -f '{{.State.Running}}' __ERSATZTV_CONTAINER__ 2>/dev/null}" == "true"}\
${color green}running\
${else}\
${color red}stopped\
${endif}${color}
${color #add8e6}Pi-hole:${color} \
${if_match "${execi 30 pihole status 2>/dev/null | grep -o 'enabled'}" == "enabled"}\
${color green}enabled\
${else}\
${color red}disabled\
${endif}${color}
${color #add8e6}Minecraft:${color} \
${if_match "${execi 30 systemctl is-active __MINECRAFT_SERVICE__}" == "active"}\
${color green}running\
${else}\
${color red}stopped\
${endif}${color}
${color #add8e6}StarRupture:${color} ${execpi 30 __BIN_DIR__/conky/starrupture_status.sh}
${color #add8e6}Converting:${color} \
${if_match "${execi 30 __BIN_DIR__/conky/conversion_status.sh}" == "idle"}\
${color #888888}idle\
${else}\
${color green}${execi 30 __BIN_DIR__/conky/conversion_status.sh}\
${endif}${color}
]];
